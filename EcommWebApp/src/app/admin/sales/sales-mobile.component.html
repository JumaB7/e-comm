<section class="px-4 py-5">
  <h1 class="font-display text-[40px] leading-11.5">Sales</h1>
  <p class="mt-3 text-[13px] leading-4.5 text-muted">Paid orders only. Profit is sales minus product cost.</p>
  <ul class="mt-4 grid grid-cols-2 gap-2">
    @for (stat of stats; track stat.label) {
      <li class="border border-line bg-white p-3">
        <p class="text-[13px] font-medium tracking-[0.08em] text-muted uppercase">{{ stat.label }}</p>
        <p class="mt-1 text-[22px] leading-6.5">{{ stat.value }}</p>
      </li>
    }
  </ul>
  <div class="mt-4 border border-line bg-white p-3">
    <p class="text-[13px] font-medium tracking-[0.08em] text-muted">PROFIT, LAST 6 MONTHS</p>
    <ul class="mt-4 flex items-end justify-between">
      @for (bar of bars; track bar.month) {
        <li class="flex w-10 flex-col items-center">
          <div class="w-5.5 rounded-sm bg-action" [ngClass]="bar.mobileClass"></div>
          <span class="mt-2 text-[13px] leading-4.5 text-muted">{{ bar.month }}</span>
        </li>
      }
    </ul>
    <p class="mt-3 text-[13px] leading-4.5 text-muted">October is the tallest bar.</p>
  </div>
</section>
