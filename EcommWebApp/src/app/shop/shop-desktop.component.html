<section class="mx-auto max-w-6xl px-6 py-12">
  <h1 class="font-display text-5xl">Shop</h1>
  <p class="mt-2 text-muted">Prices include VAT.</p>
  <ul class="mt-8 grid grid-cols-4 gap-4">
    @for (product of products(); track product.sku) {
      <li>
        <a [routerLink]="['/product', product.sku]">
          <ecomm-product-card-desktop [name]="product.name" [category]="product.category" [price]="product.price" />
        </a>
      </li>
    }
  </ul>
</section>
