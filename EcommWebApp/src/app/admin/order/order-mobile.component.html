@if (order(); as item) {
  <section class="grid gap-3">
    <h1 class="font-display text-4xl">{{ item.id }}</h1>
    <ecomm-status-pill [label]="item.status" [tone]="item.tone" />
    <div class="border border-line bg-white p-4">
      <p class="font-semibold">{{ item.customer }}</p>
      <p class="text-sm">{{ item.email }}</p>
      <p class="mt-3 text-2xl font-semibold text-action">{{ item.total }}</p>
      <p class="mt-2 text-sm text-muted">PayFast {{ item.reference || 'waiting' }}</p>
    </div>
  </section>
} @else {
  <h1 class="font-display text-3xl">Order not found.</h1>
}
