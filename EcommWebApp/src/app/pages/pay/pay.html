<section class="mx-auto grid max-w-6xl gap-8 px-6 py-12 lg:grid-cols-[1fr_320px]">
  <div>
    <h1 class="font-display text-4xl">Pay</h1>
    <p class="mt-2 max-w-xl text-muted">Choose how to pay. PayFast takes the card or bank login. This shop does not.</p>
    <ul class="mt-8 grid gap-3">
      @for (method of methods(); track method.id) {
        <li>
          <button
            type="button"
            class="w-full bg-white p-4 text-left"
            [ngClass]="selected() === method.id ? 'border-2 border-ink' : 'border border-line'"
            (click)="select(method.id)">
            <span class="block text-lg font-semibold">{{ method.title }}</span>
            <span class="mt-1 block text-sm text-muted">{{ method.detail }}</span>
          </button>
        </li>
      }
    </ul>
  </div>
  <aside class="h-fit border border-line bg-white p-6">
    <p class="text-xs font-semibold tracking-wide text-muted">ORDER VS-1048</p>
    <p class="mt-3">10×42 binoculars</p>
    <p>Merino stalking shirt</p>
    <p class="mt-2 text-sm text-muted">Courier R 120</p>
    <p class="mt-4 text-2xl font-semibold text-action">R 9 860</p>
    <p class="mt-2 text-sm text-muted">VAT included. The amount is fixed on the server.</p>
    <button type="button" class="mt-6 w-full bg-action py-3 font-semibold">Continue to PayFast</button>
  </aside>
</section>
