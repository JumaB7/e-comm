<section class="mx-auto max-w-360 px-16 py-16">
  @if (page(); as item) {
    <p class="text-[13px] font-medium tracking-[0.08em] text-muted">HELP</p>
    <h1 class="mt-3 font-display text-[40px] leading-11.5">{{ item.title }}</h1>
    <p class="mt-4 max-w-xl text-base leading-6 text-muted">{{ item.summary }}</p>
    <div class="mt-10 grid max-w-180 gap-8">
      @for (section of item.sections; track section.heading) {
        <section>
          <h2 class="text-xl font-semibold leading-6.5">{{ section.heading }}</h2>
          @for (paragraph of section.body; track paragraph) {
            <p class="mt-3 text-base leading-6">{{ paragraph }}</p>
          }
        </section>
      }
    </div>
  } @else {
    <h1 class="font-display text-[40px] leading-11.5">Help</h1>
    <p class="mt-4 text-base leading-6 text-muted">That help page was not found.</p>
    <a routerLink="/help/contact" class="mt-6 inline-block text-base leading-6">Contact us</a>
  }
</section>
