<article class="flex h-full min-h-100 flex-col gap-3 overflow-hidden rounded-sm border border-line bg-white">
  <div class="relative h-55 bg-canvas">
    @if (photo()) {
      <img [src]="photo()" [alt]="name()" class="absolute inset-0 h-full w-full object-cover" />
    }
    <p
      class="absolute inset-x-0 bottom-0 bg-linear-to-t from-white via-white/85 to-transparent px-4 pb-4 pt-8 text-[13px] font-medium tracking-[0.08em]">
      {{ category() }}
    </p>
  </div>
  <div class="flex flex-col gap-1 px-4 pb-4">
    <h2 class="font-display text-[28px] leading-8.5 tracking-[-0.01em]">{{ name() }}</h2>
    <p class="text-[13px] leading-4.5 text-muted">{{ category() }}</p>
    <p class="text-[22px] font-semibold leading-7 text-action">{{ price() }}</p>
  </div>
</article>
