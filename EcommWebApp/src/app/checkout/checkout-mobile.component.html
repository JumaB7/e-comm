<section class="grid gap-6 px-4 py-6">
  <form class="grid gap-4">
    <h1 class="font-display text-4xl">Checkout</h1>
    <label class="grid gap-1 text-xs font-semibold tracking-wide text-muted">FULL NAME
      <input class="border border-line bg-white px-3 py-3 text-base font-normal text-ink" value="Thabo Mokoena" />
    </label>
    <label class="grid gap-1 text-xs font-semibold tracking-wide text-muted">EMAIL
      <input class="border border-line bg-white px-3 py-3 text-base font-normal text-ink" value="thabo@example.co.za" />
    </label>
    <label class="grid gap-1 text-xs font-semibold tracking-wide text-muted">PHONE
      <input class="border border-line bg-white px-3 py-3 text-base font-normal text-ink" value="082 555 0142" />
    </label>
    <label class="grid gap-1 text-xs font-semibold tracking-wide text-muted">STREET
      <input class="border border-line bg-white px-3 py-3 text-base font-normal text-ink" value="14 Kloof Road" />
    </label>
    <label class="grid gap-1 text-xs font-semibold tracking-wide text-muted">SUBURB
      <input class="border border-line bg-white px-3 py-3 text-base font-normal text-ink" value="Parktown" />
    </label>
    <label class="grid gap-1 text-xs font-semibold tracking-wide text-muted">CITY
      <input class="border border-line bg-white px-3 py-3 text-base font-normal text-ink" value="Johannesburg" />
    </label>
    <label class="grid gap-1 text-xs font-semibold tracking-wide text-muted">PROVINCE
      <input class="border border-line bg-white px-3 py-3 text-base font-normal text-ink" value="Gauteng" />
    </label>
    <label class="grid gap-1 text-xs font-semibold tracking-wide text-muted">POSTAL CODE
      <input class="border border-line bg-white px-3 py-3 text-base font-normal text-ink" value="2193" />
    </label>
  </form>
  <aside class="border border-line bg-white p-4">
    @for (line of lines; track line.name) {
      <p>{{ line.name }}</p>
    }
    <p class="mt-2 text-sm text-muted">Courier {{ courier }} · VAT included</p>
    <p class="mt-3 text-2xl font-semibold text-action">{{ total }}</p>
    <a routerLink="/pay" class="mt-4 block">
      <ecomm-button label="Continue to PayFast" [full]="true" />
    </a>
  </aside>
</section>
