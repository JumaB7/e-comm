<section class="px-4 py-5">
  <form [formGroup]="form" (submit)="submit($event)">
    <h1 class="font-display text-[40px] leading-11.5">Sign in</h1>
    <p class="mt-3 text-[13px] leading-4.5 text-muted">Same account for orders and delivery.</p>
    <label class="mt-4 grid gap-1.5 text-[13px] font-medium tracking-[0.08em] text-muted">EMAIL
      <input class="h-12.5 rounded-sm border border-line bg-white px-3.5 text-base font-normal tracking-normal text-ink" formControlName="email" />
      @if (form.controls.email.invalid && (form.controls.email.touched || submitted())) {
        <span class="font-normal tracking-normal text-danger">
          @if (form.controls.email.errors?.['email']) { Enter a valid email address. } @else { Enter an email address. }
        </span>
      }
    </label>
    <label class="mt-4 grid gap-1.5 text-[13px] font-medium tracking-[0.08em] text-muted">PASSWORD
      <span class="relative block">
        <input class="h-12.5 w-full rounded-sm border border-line bg-white px-3.5 pr-16 text-base font-normal tracking-normal text-ink" [type]="passwordVisible() ? 'text' : 'password'" formControlName="password" autocomplete="current-password" />
        <button type="button" class="absolute top-1/2 right-3 -translate-y-1/2 border-0 bg-transparent p-0 text-[13px] font-normal tracking-normal text-ink" (click)="passwordVisible.update(visible => !visible)">
          {{ passwordVisible() ? 'Hide' : 'Show' }}
        </button>
      </span>
      @if (form.controls.password.invalid && (form.controls.password.touched || submitted())) {
        <span class="font-normal tracking-normal text-danger">Enter your password.</span>
      }
    </label>
    @if (notice()) {
      <p class="mt-3 text-[13px] leading-4.5 text-action">{{ notice() }}</p>
    }
    @if (error()) {
      <p class="mt-3 text-[13px] leading-4.5 text-danger">{{ error() }}</p>
    }
    <button type="submit" class="mt-4 w-full border-0 bg-transparent p-0">
      <ecomm-button label="Sign in" [full]="true" />
    </button>
    <a routerLink="/forgot-password" class="mt-4 inline-block leading-6">Forgot password?</a>
    <a routerLink="/register" class="mt-2 inline-block leading-6">New here? Create an account</a>
  </form>
</section>
