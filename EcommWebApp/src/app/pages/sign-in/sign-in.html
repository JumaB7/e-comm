<section class="mx-auto max-w-md px-6 py-16">
  <form class="border border-line bg-white p-8">
    <h1 class="font-display text-4xl">Sign in</h1>
    <p class="mt-2 text-sm text-muted">Use the same account for orders and delivery.</p>
    <label class="mt-6 block text-xs font-semibold tracking-wide text-muted" for="email">EMAIL</label>
    <input id="email" type="email" class="mt-2 w-full border border-line px-3 py-3" autocomplete="email">
    <label class="mt-4 block text-xs font-semibold tracking-wide text-muted" for="password">PASSWORD</label>
    <input id="password" type="password" class="mt-2 w-full border border-line px-3 py-3" autocomplete="current-password">
    <button type="button" class="mt-6 w-full bg-action py-3 font-semibold">Sign in</button>
    <a routerLink="/register" class="mt-4 inline-block text-action">New here? Create an account</a>
  </form>
</section>
