<section class="px-4 py-5">
  <form [formGroup]="form" (submit)="submit($event)">
    <h1 class="font-display text-40 leading-11.5">Forgot password</h1>
    <p class="mt-3 text-13 leading-4.5 text-muted">
      Enter the email on the account. We send a one-time link to choose a new password.
    </p>
    <label class="mt-4 grid gap-1.5 text-13 font-medium tracking-label text-muted">EMAIL
      <input class="h-12.5 rounded-sm border border-line bg-white px-3.5 text-base font-normal tracking-normal text-ink" formControlName="email" autocomplete="email" />
      @if (form.controls.email.invalid && (form.controls.email.touched || submitted())) {
        <span class="font-normal tracking-normal text-danger">
          @if (form.controls.email.errors?.['email']) { Enter a valid email address. } @else { Enter an email address. }
        </span>
      }
    </label>
    @if (error()) {
      <p class="mt-3 text-13 leading-4.5 text-danger">{{ error() }}</p>
    }
    @if (notice()) {
      <p class="mt-3 text-13 leading-4.5 text-action break-all">{{ notice() }}</p>
    }
    <button type="submit" class="mt-4 w-full border-0 bg-transparent p-0 disabled:opacity-50" [disabled]="busy()">
      <ecomm-button [label]="busy() ? 'Sending…' : 'Send reset link'" [full]="true" />
    </button>
    <a routerLink="/sign-in" class="mt-4 inline-block leading-6">Back to sign in</a>
  </form>
</section>
