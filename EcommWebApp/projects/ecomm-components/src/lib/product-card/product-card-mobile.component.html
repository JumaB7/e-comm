<article class="flex h-full flex-col gap-2 overflow-hidden rounded-sm border border-line bg-white">
  <div class="flex h-30 items-end bg-canvas pb-2.5 pl-2.5">
    <p class="text-[13px] leading-4.5 text-muted">{{ category() }}</p>
  </div>
  <div class="flex flex-col gap-0.5 px-2.5 pb-3">
    <h2 class="text-[15px] font-semibold leading-5">{{ name() }}</h2>
    <p class="text-base font-semibold leading-5.5 text-action">{{ price() }}</p>
  </div>
</article>
