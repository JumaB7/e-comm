<div class="min-h-screen bg-canvas">
  <header class="flex items-center justify-between bg-ink px-4 py-3 text-white">
    <p class="font-display text-xl">Veld Supply</p>
    <p class="text-xs font-semibold text-action">ADMIN</p>
  </header>
  <nav class="grid grid-cols-4 bg-white text-center text-sm">
    @for (link of links; track link.path) {
      <a [routerLink]="link.path" routerLinkActive="bg-action" class="py-3" [routerLinkActiveOptions]="{ exact: true }">
        {{ link.label }}
      </a>
    }
  </nav>
  <main class="p-4">
    <router-outlet />
  </main>
</div>
