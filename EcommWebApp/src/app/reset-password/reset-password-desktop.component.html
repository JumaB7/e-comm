<section class="px-6 py-16">
  <form class="mx-auto w-full max-w-110 border border-line bg-white px-7 py-8" [formGroup]="form" (submit)="submit($event)">
    <h1 class="font-display text-[40px] leading-11.5">Choose a new password</h1>
    <p class="mt-3 text-[13px] leading-4.5 text-muted">This link works once and expires after an hour.</p>
    <label class="mt-4 grid gap-1.5 text-[13px] font-medium tracking-[0.08em] text-muted">NEW PASSWORD
      <span class="relative block">
        <input class="h-12.5 w-full rounded-sm border border-line bg-white px-3.5 pr-16 text-base font-normal tracking-normal text-ink" [type]="passwordVisible() ? 'text' : 'password'" formControlName="password" autocomplete="new-password" />
        <button type="button" class="absolute top-1/2 right-3 -translate-y-1/2 border-0 bg-transparent p-0 text-[13px] font-normal tracking-normal text-ink" (click)="passwordVisible.update(visible => !visible)">
          {{ passwordVisible() ? 'Hide' : 'Show' }}
        </button>
      </span>
      @if (form.controls.password.invalid && (form.controls.password.touched || submitted())) {
        <span class="font-normal tracking-normal text-danger">
          @if (form.controls.password.errors?.['minlength']) { Use at least 8 characters. } @else { Enter a password. }
        </span>
      }
    </label>
    <label class="mt-4 grid gap-1.5 text-[13px] font-medium tracking-[0.08em] text-muted">CONFIRM PASSWORD
      <span class="relative block">
        <input class="h-12.5 w-full rounded-sm border border-line bg-white px-3.5 pr-16 text-base font-normal tracking-normal text-ink" [type]="confirmVisible() ? 'text' : 'password'" formControlName="confirmPassword" autocomplete="new-password" />
        <button type="button" class="absolute top-1/2 right-3 -translate-y-1/2 border-0 bg-transparent p-0 text-[13px] font-normal tracking-normal text-ink" (click)="confirmVisible.update(visible => !visible)">
          {{ confirmVisible() ? 'Hide' : 'Show' }}
        </button>
      </span>
      @if ((form.controls.confirmPassword.invalid || form.errors?.['passwordMismatch']) && (form.controls.confirmPassword.touched || submitted())) {
        <span class="font-normal tracking-normal text-danger">
          @if (form.controls.confirmPassword.errors?.['required']) { Confirm your password. } @else { Those passwords do not match. }
        </span>
      }
    </label>
    @if (error()) {
      <p class="mt-3 text-[13px] leading-4.5 text-danger">{{ error() }}</p>
    }
    <button type="submit" class="mt-4 w-full border-0 bg-transparent p-0 disabled:opacity-50" [disabled]="busy() || !token">
      <ecomm-button [label]="busy() ? 'Updating…' : 'Update password'" [full]="true" />
    </button>
    <a routerLink="/forgot-password" class="mt-4 inline-block text-base leading-6">Request a new link</a>
  </form>
</section>
