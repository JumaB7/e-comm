<article class="flex h-full min-h-100 flex-col overflow-hidden rounded-sm border border-line bg-white">
  <div class="relative h-55 bg-canvas">
    @if (photo()) {
      <img [src]="photo()" [alt]="name()" class="absolute inset-0 h-full w-full object-cover" />
    }
    @if (outOfStock()) {
      <span
        class="absolute top-3 left-3 z-10 inline-flex items-center rounded-sm bg-danger px-2 py-1 text-xs font-medium leading-4 text-white"
        >Out of stock</span
      >
    } @else if (lowStockHint()) {
      <span
        class="absolute top-3 left-3 z-10 inline-flex items-center rounded-sm border border-line bg-canvas px-2 py-1 text-xs font-medium leading-4 text-ink"
        >{{ lowStockHint() }}</span
      >
    }
  </div>
  <div class="flex flex-col gap-1 px-4 py-4">
    <p class="text-[13px] font-medium tracking-[0.08em] text-muted">{{ category() }}</p>
    <h2 class="font-display text-[28px] leading-8.5 tracking-[-0.01em]">{{ name() }}</h2>
    <p class="text-[22px] font-semibold leading-7 text-action">{{ price() }}</p>
  </div>
</article>
