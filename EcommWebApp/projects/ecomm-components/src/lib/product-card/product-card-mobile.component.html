<article class="flex h-full flex-col overflow-hidden rounded-sm border border-line bg-white">
  <div class="relative h-30 bg-canvas">
    @if (photo()) {
      <img [src]="photo()" [alt]="name()" class="absolute inset-0 h-full w-full object-cover" />
    }
    @if (outOfStock()) {
      <div class="absolute top-2 left-2 z-10">
        <ecomm-status-pill label="Out of stock" tone="low" />
      </div>
    } @else if (lowStockHint()) {
      <div class="absolute top-2 left-2 z-10">
        <ecomm-status-pill [label]="lowStockHint()" tone="awaiting" />
      </div>
    }
  </div>
  <div class="flex flex-col gap-0.5 px-2.5 py-3">
    <p class="text-[13px] leading-4.5 text-muted">{{ category() }}</p>
    <h2 class="text-[15px] font-semibold leading-5">{{ name() }}</h2>
    <p class="text-base font-semibold leading-5.5 text-action">{{ price() }}</p>
  </div>
</article>
