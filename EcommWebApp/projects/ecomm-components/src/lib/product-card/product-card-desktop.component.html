<article class="flex h-full min-h-[400px] flex-col gap-3 rounded-sm border border-line bg-white">
  <div class="flex h-[220px] items-end bg-canvas px-4 pb-4">
    <p class="text-[13px] font-medium tracking-[0.08em]">{{ category() }}</p>
  </div>
  <div class="flex flex-col gap-1 px-4 pb-4">
    <h2 class="font-display text-[28px] leading-[34px] tracking-[-0.01em]">{{ name() }}</h2>
    <p class="text-[13px] leading-[18px] text-muted">{{ category() }}</p>
    <p class="text-[22px] font-semibold leading-7 text-action">{{ price() }}</p>
  </div>
</article>
