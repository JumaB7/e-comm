<section class="px-4 py-5">
  <h1 class="font-display text-[40px] leading-[46px]">Stock</h1>
  <p class="mt-3 text-[13px] leading-[18px] text-muted">Add or remove units. Delete takes it off the shop.</p>
  <label class="mt-4 grid gap-1.5 text-[13px] font-medium tracking-[0.08em] text-muted">PRODUCT
    <input class="h-[50px] rounded-sm border border-line bg-white px-3.5 text-base font-normal tracking-normal text-ink" [value]="stockName()" (input)="setName($event)" />
  </label>
  <label class="mt-4 grid gap-1.5 text-[13px] font-medium tracking-[0.08em] text-muted">QUANTITY
    <input class="h-[50px] rounded-sm border border-line bg-white px-3.5 text-base font-normal tracking-normal text-ink" [value]="stockQty()" (input)="setQty($event)" />
  </label>
  <button type="button" class="mt-4 w-full border-0 bg-transparent p-0" (click)="addStock()">
    <ecomm-button label="Add stock" [full]="true" />
  </button>
  <button type="button" class="mt-3 w-full border-0 bg-transparent p-0" (click)="removeStock()">
    <ecomm-button label="Remove stock" variant="secondary" [full]="true" />
  </button>
  <ul class="mt-4 grid gap-2">
    @for (product of products(); track product.sku) {
      <li>
        <button type="button" class="w-full border border-line bg-white p-4 text-left" (click)="choose(product.sku)">
          <span class="block text-lg leading-[26px]">{{ product.name }}</span>
          <span class="mt-1 block text-[13px] leading-[18px] text-muted">{{ product.sku }} · {{ product.stock }} on hand</span>
        </button>
      </li>
    }
  </ul>
  @if (pending()) {
    <div class="mt-4 border border-danger bg-white p-4">
      <p class="text-lg leading-[26px]">Delete this product?</p>
      <p class="mt-2 text-[13px] leading-[18px] text-muted">It leaves the shop. Past orders stay.</p>
      <button type="button" class="mt-4 w-full border-0 bg-transparent p-0" (click)="deleteProduct()">
        <ecomm-button label="Delete" [full]="true" />
      </button>
      <button type="button" class="mt-3 w-full border-0 bg-transparent p-0" (click)="keep()">
        <ecomm-button label="Keep" variant="secondary" [full]="true" />
      </button>
    </div>
  }
</section>
