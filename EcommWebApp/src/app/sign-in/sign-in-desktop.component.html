<section class="px-6 py-16">
  <form class="mx-auto w-full max-w-110 border border-line bg-white px-7 py-8" (submit)="submit($event)">
    <h1 class="font-display text-[40px] leading-11.5">Sign in</h1>
    <p class="mt-3 text-[13px] leading-4.5 text-muted">Use the same account for orders and delivery.</p>
    <label class="mt-4 grid gap-1.5 text-[13px] font-medium tracking-[0.08em] text-muted">EMAIL
      <input class="h-12.5 rounded-sm border border-line bg-white px-3.5 text-base font-normal tracking-normal text-ink" [value]="email()" (input)="setField('email', $event)" />
    </label>
    <label class="mt-4 grid gap-1.5 text-[13px] font-medium tracking-[0.08em] text-muted">PASSWORD
      <input type="password" class="h-12.5 rounded-sm border border-line bg-white px-3.5 text-base font-normal tracking-normal text-ink" [value]="password()" (input)="setField('password', $event)" />
    </label>
    @if (error()) {
      <p class="mt-3 text-[13px] leading-4.5 text-danger">{{ error() }}</p>
    }
    <button type="submit" class="mt-4 w-full border-0 bg-transparent p-0">
      <ecomm-button label="Sign in" [full]="true" />
    </button>
    <a routerLink="/register" class="mt-4 inline-block text-base leading-6">New here? Create an account</a>
  </form>
</section>
