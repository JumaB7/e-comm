<section class="px-4 py-5">
  <h1 class="font-display text-[40px] leading-11.5">Stock</h1>
  <p class="mt-3 text-[13px] leading-4.5 text-muted">Add or remove units. Delete takes it off the shop.</p>
  <div class="mt-4 grid gap-4" [formGroup]="form">
    <label class="grid gap-1.5 text-[13px] font-medium tracking-[0.08em] text-muted">PRODUCT
      <input class="h-12.5 rounded-sm border border-line bg-white px-3.5 text-base font-normal tracking-normal text-ink" formControlName="name" />
      @if (form.controls.name.invalid && (form.controls.name.touched || submitted())) {
        <span class="font-normal tracking-normal text-danger">Enter a product name.</span>
      }
    </label>
    <label class="grid gap-1.5 text-[13px] font-medium tracking-[0.08em] text-muted">QUANTITY
      <input class="h-12.5 rounded-sm border border-line bg-white px-3.5 text-base font-normal tracking-normal text-ink" formControlName="qty" />
      @if (form.controls.qty.invalid && (form.controls.qty.touched || submitted())) {
        <span class="font-normal tracking-normal text-danger">
          @if (form.controls.qty.errors?.['required']) { Enter a quantity. } @else { Use at least 1. }
        </span>
      }
    </label>
  </div>
  <button type="button" class="mt-4 w-full border-0 bg-transparent p-0" (click)="addStock()">
    <ecomm-button label="Add stock" [full]="true" />
  </button>
  <button type="button" class="mt-3 w-full border-0 bg-transparent p-0" (click)="removeStock()">
    <ecomm-button label="Remove stock" variant="secondary" [full]="true" />
  </button>
  <ul class="mt-4 grid gap-2">
    @for (product of products(); track product.sku) {
      <li>
        <button type="button" class="w-full border border-line bg-white p-4 text-left" (click)="choose(product.sku)">
          <span class="block text-lg leading-6.5">{{ product.name }}</span>
          <span class="mt-1 block text-[13px] leading-4.5 text-muted">{{ product.sku }} · {{ product.stock }} on hand</span>
        </button>
      </li>
    }
  </ul>
  @if (pending()) {
    <div class="mt-4 border border-danger bg-white p-4">
      <p class="text-lg leading-6.5">Delete this product?</p>
      <p class="mt-2 text-[13px] leading-4.5 text-muted">It leaves the shop. Past orders stay.</p>
      <button type="button" class="mt-4 w-full border-0 bg-transparent p-0" (click)="deleteProduct()">
        <ecomm-button label="Delete" [full]="true" />
      </button>
      <button type="button" class="mt-3 w-full border-0 bg-transparent p-0" (click)="keep()">
        <ecomm-button label="Keep" variant="secondary" [full]="true" />
      </button>
    </div>
  }
</section>
