<section>
  <h1 class="font-display text-5xl">Products</h1>
  <div class="mt-6 border border-line bg-white">
    @for (product of products(); track product.sku) {
      <div class="grid grid-cols-4 items-center border-b border-line px-4 py-4 last:border-b-0">
        <span [class.text-danger]="product.low">{{ product.name }}</span>
        <span class="text-sm text-muted">{{ product.sku }}</span>
        <span>{{ product.price }}</span>
        <span>{{ product.stock }} @if (product.low) { <ecomm-status-pill label="Low" tone="low" /> }</span>
      </div>
    }
  </div>
</section>
