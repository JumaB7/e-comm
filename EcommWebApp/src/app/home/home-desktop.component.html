<section class="mx-auto max-w-6xl px-6 py-14">
  <div class="bg-ink px-10 py-14 text-white">
    <p class="text-sm font-semibold tracking-wide text-action">THE RANGE</p>
    <h1 class="mt-3 font-display text-6xl">Gear for the stalk.</h1>
    <p class="mt-4 max-w-xl text-lg">Optics, apparel, knives, and camp kit. Pay on PayFast.</p>
    <a routerLink="/shop" class="mt-8 inline-block">
      <ecomm-button label="Shop the range" />
    </a>
  </div>
  <h2 class="mt-12 font-display text-3xl">Shop by kit</h2>
  <ul class="mt-4 grid grid-cols-4 gap-3">
    @for (category of categories; track category) {
      <li>
        <a routerLink="/shop" class="block border border-line bg-white p-5">
          <p class="text-xs font-semibold text-action">KIT</p>
          <p class="mt-2 text-xl">{{ category }}</p>
        </a>
      </li>
    }
  </ul>
  <h2 class="mt-12 font-display text-3xl">In the shop</h2>
  <ul class="mt-4 grid grid-cols-4 gap-4">
    @for (product of featured(); track product.sku) {
      <li>
        <a [routerLink]="['/product', product.sku]">
          <ecomm-product-card-desktop [name]="product.name" [category]="product.category" [price]="product.price" />
        </a>
      </li>
    }
  </ul>
</section>
