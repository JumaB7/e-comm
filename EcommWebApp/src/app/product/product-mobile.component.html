<section class="px-4 py-6">
  @if (product(); as item) {
    <div class="aspect-square bg-white"></div>
    <p class="mt-4 text-xs font-semibold tracking-wide text-action uppercase">{{ item.category }}</p>
    <h1 class="mt-1 font-display text-3xl">{{ item.name }}</h1>
    <p class="mt-3 text-2xl font-semibold text-action">{{ item.price }}</p>
    <p class="mt-1 text-sm text-muted">{{ item.sku }} · {{ item.stock }} in stock</p>
    <a routerLink="/checkout" class="mt-6 block">
      <ecomm-button label="Add to bag" [full]="true" />
    </a>
  } @else {
    <h1 class="font-display text-3xl">That product is not in the shop.</h1>
  }
</section>
