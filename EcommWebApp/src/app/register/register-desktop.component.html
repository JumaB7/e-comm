<section class="mx-auto max-w-md px-6 py-16">
  <form class="border border-line bg-white p-8">
    <h1 class="font-display text-4xl">Create account</h1>
    <p class="mt-2 text-sm text-muted">Name, email, and a password. That is all we store.</p>
    <label class="mt-6 grid gap-2 text-xs font-semibold tracking-wide text-muted">FULL NAME
      <input class="border border-line px-3 py-3 text-base font-normal text-ink" value="Thabo Mokoena" />
    </label>
    <label class="mt-4 grid gap-2 text-xs font-semibold tracking-wide text-muted">EMAIL
      <input class="border border-line px-3 py-3 text-base font-normal text-ink" value="thabo@example.co.za" />
    </label>
    <label class="mt-4 grid gap-2 text-xs font-semibold tracking-wide text-muted">PHONE
      <input class="border border-line px-3 py-3 text-base font-normal text-ink" value="082 555 0142" />
    </label>
    <label class="mt-4 grid gap-2 text-xs font-semibold tracking-wide text-muted">PASSWORD
      <input type="password" class="border border-line px-3 py-3 text-base font-normal text-ink" value="password" />
    </label>
    <a routerLink="/shop" class="mt-6 block">
      <ecomm-button label="Create account" [full]="true" />
    </a>
    <a routerLink="/sign-in" class="mt-4 inline-block text-action">Already have an account? Sign in</a>
  </form>
</section>
