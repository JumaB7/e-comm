<div class="flex min-h-screen bg-canvas text-ink">
  <aside class="flex w-62 shrink-0 flex-col bg-inverse px-5 py-7 text-white">
    <p class="font-display text-[22px] leading-none">Veld Supply</p>
    <p class="mt-2 text-[13px] font-medium tracking-[0.08em] text-action">ADMIN</p>
    <nav class="mt-6 grid gap-1">
      @for (link of links; track link.path) {
        <a
          [routerLink]="link.path"
          routerLinkActive="bg-black"
          class="rounded-sm px-3 py-2.5 text-base text-white"
          [routerLinkActiveOptions]="{ exact: link.exact }">
          {{ link.label }}
        </a>
      }
    </nav>
    <div class="flex-1"></div>
    <a routerLink="/" class="text-[13px] leading-4.5">Sign out</a>
  </aside>
  <main class="min-w-0 flex-1 p-9">
    <router-outlet />
  </main>
</div>
