<div class="flex min-h-screen flex-col bg-canvas text-ink">
  <p class="bg-ink py-2 text-center text-13 leading-4.5 text-white">Free courier over R1 500 · Prices include VAT</p>
  <header class="border-b border-line bg-white px-4 py-3.5">
    <div class="flex items-center justify-between">
      <a routerLink="/" aria-label="Veld Supply" class="block">
        <img src="/kudu-logo.svg" alt="" class="h-9 w-auto" />
      </a>
      <a routerLink="/checkout" class="inline-flex items-center gap-1.5 text-13 font-medium tracking-label" [attr.aria-label]="'Bag, ' + bagCount() + ' items'">
        <svg class="h-5 w-5" viewBox="0 0 24 24" fill="none" aria-hidden="true">
          <path d="M6.5 9h11l-1 11.5H7.5L6.5 9Z" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round" />
          <path d="M9 9V7.5a3 3 0 0 1 6 0V9" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" />
        </svg>
        <span>{{ bagCount() }}</span>
      </a>
    </div>
    <nav class="mt-3 flex flex-wrap items-center gap-x-4 gap-y-2 text-13 font-medium tracking-label">
      @for (link of links(); track link.label) {
        <a [routerLink]="link.path" [ngClass]="activeLabel() === link.label ? 'text-ink' : 'text-muted'">{{ link.label }}</a>
      }
      @if (userData(); as user) {
        <span class="text-ink">{{ user.name }}</span>
        @if (user.role === 'Admin') {
          <a routerLink="/admin" class="text-muted">ADMIN</a>
        }
        <button type="button" class="border-0 bg-transparent p-0 text-muted" (click)="signOut()">SIGN OUT</button>
      }
    </nav>
  </header>
  @if (showSearch()) {
    <div class="bg-white px-4 pb-3">
      <input
        class="h-12.5 w-full rounded-sm border border-line bg-white px-3.5 text-base placeholder:text-muted"
        placeholder="Search gear"
        aria-label="Search gear"
        [value]="search()"
        (input)="onSearch($event)" />
    </div>
  }
  <div class="flex-1">
    <router-outlet />
  </div>
  <footer class="bg-ink px-4 py-6 text-white">
    <img src="/kudu-logo.svg" alt="Veld Supply" class="h-9 w-auto" />
    <p class="mt-3 text-13 leading-4.5">PayFast · Courier nationwide · VAT included</p>
  </footer>
</div>
