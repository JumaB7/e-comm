<section class="px-4 py-8">
  <p class="text-sm font-semibold tracking-wide text-action">THE RANGE</p>
  <h1 class="mt-2 font-display text-4xl">Gear for the stalk.</h1>
  <p class="mt-3 text-muted">Optics, apparel, knives, and camp kit. Pay on PayFast.</p>
  <a routerLink="/shop" class="mt-6 block">
    <ecomm-button label="Shop the range" [full]="true" />
  </a>
  <h2 class="mt-10 font-display text-2xl">Shop by kit</h2>
  <ul class="mt-3 grid grid-cols-2 gap-3">
    @for (category of categories; track category) {
      <li>
        <a routerLink="/shop" class="block border border-line bg-white p-4">
          <p class="text-xs font-semibold text-action">KIT</p>
          <p class="mt-1 text-lg">{{ category }}</p>
        </a>
      </li>
    }
  </ul>
  <h2 class="mt-10 font-display text-2xl">In the shop</h2>
  <ul class="mt-3 grid grid-cols-2 gap-3">
    @for (product of featured(); track product.sku) {
      <li>
        <a [routerLink]="['/product', product.sku]">
          <ecomm-product-card-mobile [name]="product.name" [category]="product.category" [price]="product.price" />
        </a>
      </li>
    }
  </ul>
</section>
