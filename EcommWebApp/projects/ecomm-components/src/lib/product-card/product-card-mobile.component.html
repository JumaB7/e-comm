<article class="flex h-full flex-col gap-2 overflow-hidden rounded-sm border border-line bg-white">
  <div class="relative h-30 bg-canvas">
    @if (photo()) {
      <img [src]="photo()" [alt]="name()" class="absolute inset-0 h-full w-full object-cover" />
    }
    <p
      class="absolute inset-x-0 bottom-0 bg-linear-to-t from-white via-white/85 to-transparent pb-2.5 pl-2.5 pt-6 text-[13px] leading-4.5 text-muted">
      {{ category() }}
    </p>
  </div>
  <div class="flex flex-col gap-0.5 px-2.5 pb-3">
    <h2 class="text-[15px] font-semibold leading-5">{{ name() }}</h2>
    <p class="text-base font-semibold leading-5.5 text-action">{{ price() }}</p>
  </div>
</article>
