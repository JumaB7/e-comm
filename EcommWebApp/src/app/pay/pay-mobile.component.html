<section class="grid gap-4 px-4 py-6">
  <h1 class="font-display text-4xl">Pay</h1>
  <p class="text-muted">PayFast takes the card or bank login. This shop does not.</p>
  @for (method of methods; track method.id) {
    <button
      type="button"
      class="bg-white p-4 text-left"
      [ngClass]="selected() === method.id ? 'border-2 border-ink' : 'border border-line'"
      (click)="selected.set(method.id)">
      <span class="block font-semibold">{{ method.title }}</span>
      <span class="mt-1 block text-sm text-muted">{{ method.detail }}</span>
    </button>
  }
  <aside class="border border-line bg-white p-4">
    <p class="text-xs font-semibold tracking-wide text-muted">ORDER VS-1048</p>
    <p class="mt-2">Binoculars and stalking shirt</p>
    <p class="text-sm text-muted">Courier R 120 · VAT included</p>
    <p class="mt-3 text-2xl font-semibold text-action">{{ total }}</p>
  </aside>
  <a routerLink="/paid">
    <ecomm-button label="Continue to PayFast" [full]="true" />
  </a>
</section>
