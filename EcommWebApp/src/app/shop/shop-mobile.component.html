<section class="px-4 py-6">
  <h1 class="font-display text-4xl">Shop</h1>
  <ul class="mt-4 grid grid-cols-2 gap-3">
    @for (product of products(); track product.sku) {
      <li>
        <a [routerLink]="['/product', product.sku]">
          <ecomm-product-card-mobile [name]="product.name" [category]="product.category" [price]="product.price" />
        </a>
      </li>
    }
  </ul>
</section>
