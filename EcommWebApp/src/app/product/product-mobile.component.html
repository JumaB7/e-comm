<section class="px-4 py-4">
  @if (product(); as item) {
    <div class="relative h-55 overflow-hidden bg-canvas">
      <img [src]="'/products/' + item.sku + '.jpg'" [alt]="item.name" class="h-full w-full object-cover" />
    </div>
    <p class="mt-4 text-[13px] font-medium tracking-[0.08em] uppercase">{{ item.category }}</p>
    <h1 class="mt-3 font-display text-[40px] leading-11.5">{{ item.name }}</h1>
    <p class="mt-3 text-[22px] font-semibold leading-7 text-action">{{ item.price }}</p>
    <p class="mt-3 text-[13px] leading-4.5 text-muted">Incl. VAT · {{ item.stock }} in stock · SKU {{ item.sku }}</p>
    <p class="mt-3 text-base leading-6">{{ item.blurb }}</p>
    <button type="button" class="mt-4 w-full border-0 bg-transparent p-0" (click)="addToBag()">
      <ecomm-button label="Add to bag" [full]="true" />
    </button>
    <p class="mt-3 text-[13px] leading-4.5 text-muted">You pay on PayFast. No card number on this page.</p>
  } @else if (ready()) {
    <h1 class="font-display text-[40px] leading-11.5">That product is not in the shop.</h1>
  }
</section>
