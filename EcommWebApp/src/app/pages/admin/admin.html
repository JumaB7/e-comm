<section class="mx-auto max-w-6xl px-6 py-12">
  <h1 class="font-display text-4xl">Sales</h1>
  <p class="mt-2 text-muted">Sample figures for the layout. Paid orders only, once PayFast confirms them.</p>
  <ul class="mt-8 grid gap-3 sm:grid-cols-2 lg:grid-cols-4">
    @for (stat of stats(); track stat.label) {
      <li class="border border-line bg-white p-4">
        <p class="text-xs font-semibold tracking-wide text-muted">{{ stat.label }}</p>
        <p class="mt-2 text-2xl">{{ stat.value }}</p>
      </li>
    }
  </ul>
</section>
