<div class="min-h-screen bg-canvas text-ink">
  <header class="flex items-center justify-between border-b border-line bg-white px-4 py-4">
    <img src="/kudu-logo.svg" alt="Veld Supply" class="h-9 w-auto" />
    <p class="text-[13px] font-medium tracking-[0.08em] text-action">ADMIN</p>
  </header>
  <nav class="grid grid-cols-4 border-b border-line bg-white text-center text-[13px]">
    @for (link of links; track link.path) {
      <a
        [routerLink]="link.path"
        routerLinkActive="border-ink text-ink"
        class="border-b-2 border-transparent py-3 text-muted"
        [routerLinkActiveOptions]="{ exact: link.exact }">
        {{ link.label }}
      </a>
    }
  </nav>
  <main>
    <router-outlet />
  </main>
</div>
