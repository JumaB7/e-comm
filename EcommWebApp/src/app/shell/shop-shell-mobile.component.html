<div class="min-h-screen bg-canvas text-ink">
  <p class="bg-ink py-2 text-center text-[13px] leading-4.5 text-white">Free courier over R1 500 · Prices include VAT</p>
  <header class="flex items-center justify-between bg-white px-4 py-3.5">
    <a routerLink="/" aria-label="Veld Supply" class="block">
      <img src="/kudu-logo.svg" alt="" class="h-9 w-auto" />
    </a>
    <div class="flex items-center gap-4 text-[13px] font-medium tracking-[0.08em]">
      @if (accountName()) {
        @if (accountRole() === 'Admin') {
          <a routerLink="/admin">ADMIN</a>
        }
        <button type="button" class="border-0 bg-transparent p-0" (click)="signOut()">SIGN OUT</button>
      } @else {
        <a routerLink="/sign-in">ACCOUNT</a>
      }
      <a routerLink="/checkout">BAG {{ bagCount() }}</a>
    </div>
  </header>
  @if (showSearch()) {
    <div class="bg-white px-4 pb-3">
      <input
        class="h-12.5 w-full rounded-sm border border-line bg-white px-3.5 text-base placeholder:text-muted"
        placeholder="Search gear"
        aria-label="Search gear"
        [value]="search()"
        (input)="onSearch($event)" />
    </div>
  }
  <router-outlet />
  <footer class="bg-ink px-4 py-6 text-white">
    <img src="/kudu-logo.svg" alt="Veld Supply" class="h-9 w-auto" />
    <p class="mt-3 text-[13px] leading-4.5">PayFast · Courier nationwide · VAT included</p>
  </footer>
</div>
