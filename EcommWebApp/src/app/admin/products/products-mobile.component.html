<section>
  <h1 class="font-display text-4xl">Products</h1>
  <ul class="mt-4 grid gap-3">
    @for (product of products(); track product.sku) {
      <li class="border border-line bg-white p-4">
        <p class="font-semibold" [class.text-danger]="product.low">{{ product.name }}</p>
        <p class="text-sm text-muted">{{ product.sku }} · {{ product.stock }} on hand</p>
        <p class="mt-2 font-semibold text-action">{{ product.price }}</p>
        @if (product.low) {
          <ecomm-status-pill label="Low" tone="low" />
        }
      </li>
    }
  </ul>
</section>
