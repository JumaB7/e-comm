<section class="px-4 py-5">
  <h1 class="font-display text-[40px] leading-11.5">Create account</h1>
  <p class="mt-3 text-[13px] leading-4.5 text-muted">Name, email, and a password.</p>
  <label class="mt-4 grid gap-1.5 text-[13px] font-medium tracking-[0.08em] text-muted">FULL NAME
    <input class="h-12.5 rounded-sm border border-line bg-white px-3.5 text-base font-normal tracking-normal text-ink" value="Thabo Mokoena" />
  </label>
  <label class="mt-4 grid gap-1.5 text-[13px] font-medium tracking-[0.08em] text-muted">EMAIL
    <input class="h-12.5 rounded-sm border border-line bg-white px-3.5 text-base font-normal tracking-normal text-ink" value="thabo@example.co.za" />
  </label>
  <label class="mt-4 grid gap-1.5 text-[13px] font-medium tracking-[0.08em] text-muted">PHONE
    <input class="h-12.5 rounded-sm border border-line bg-white px-3.5 text-base font-normal tracking-normal text-ink" value="082 555 0142" />
  </label>
  <label class="mt-4 grid gap-1.5 text-[13px] font-medium tracking-[0.08em] text-muted">PASSWORD
    <input type="password" class="h-12.5 rounded-sm border border-line bg-white px-3.5 text-base font-normal tracking-normal text-ink" value="password" />
  </label>
  <a routerLink="/shop" class="mt-4 block">
    <ecomm-button label="Create account" [full]="true" />
  </a>
  <a routerLink="/sign-in" class="mt-4 inline-block leading-6">Already have an account? Sign in</a>
</section>
